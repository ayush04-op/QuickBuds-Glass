name: Build Debug APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Check locales
        run: python3 scripts/check-locales.py

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log

      - name: Show build errors
        if: failure()
        run: |
          grep -E "^e: |error:|FAILURE:|What went wrong|Execution failed|> " build.log | head -30 \
            | while IFS= read -r line; do echo "::error::${line}"; done

      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: QuickBuds-Glass-APK
          path: app/build/outputs/apk/debug/app-debug.apk
